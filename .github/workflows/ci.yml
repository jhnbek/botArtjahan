name: Knowledge core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  knowledge-core:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile the independent core
        run: python -m compileall -q knowledge_core tests

      - name: Check the command line entry point
        run: python -m knowledge_core --help

      - name: Run synthetic tests
        run: python -m unittest discover -s tests -p "test_knowledge_core_*.py" -v

      - name: Restore and validate the published knowledge snapshot
        if: runner.os == 'Linux'
        run: python -m knowledge_core restore-published knowledge "${{ runner.temp }}/lecture-knowledge"
